<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:rgba(120,120,128,.12);
  --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --bar:rgba(249,249,249,.82);
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --card:#1C1C1E; --fill:rgba(118,118,128,.24);
    --label:#FFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.55); --bar:rgba(22,22,24,.82);
    --blue:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--label)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Roboto,"Helvetica Neue",sans-serif;
  font-size:17px;line-height:1.3;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(90px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Barra superiore */
.topbar{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.topbar.ombra{box-shadow:0 .5px 0 var(--sep)}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label2);flex:1}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--red)}
.sync.on i{background:var(--green)}
.link{color:var(--blue);font-size:17px;padding:6px 4px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#A0A4AE,#7E828C);color:#fff;
  font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center}
.plus{width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--blue);display:flex;align-items:center;justify-content:center}

main{max-width:640px;margin:0 auto;padding:0 16px}
.titolo{font-size:34px;font-weight:700;letter-spacing:.01em;padding:4px 4px 2px}
.sottotitolo{color:var(--label2);font-size:15px;padding:0 4px 14px}

/* Striscia settimana */
.settimana{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;align-items:center;margin-bottom:18px}
.settimana .freccia{color:var(--blue);height:56px;display:flex;align-items:center;justify-content:center}
.gg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0}
.gg span{font-size:12px;color:var(--label2);font-weight:500}
.gg b{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500}
.gg.oggi b{color:var(--blue);font-weight:600}
.gg.sel b{background:var(--label);color:var(--bg);font-weight:600}
.gg.sel.oggi b{background:var(--blue);color:#fff}

/* Riepilogo con anello */
.riepilogo{background:var(--card);border-radius:14px;padding:16px;display:flex;align-items:center;gap:16px;margin-bottom:22px}
.anello{position:relative;width:76px;height:76px;flex:none}
.anello svg{transform:rotate(-90deg)}
.anello circle{fill:none;stroke-width:9;stroke-linecap:round}
.anello .traccia{stroke:var(--fill)}
.anello .prog{stroke:var(--green);transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.anello div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.riepilogo h3{font-size:20px;font-weight:600;margin-bottom:2px}
.riepilogo p{color:var(--label2);font-size:15px}
.riepilogo p.rosso{color:var(--red);font-weight:500}

/* Avvisi */
.banner{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:22px}
.banner .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.banner p{font-size:15px;color:var(--label2)}
.banner p b{color:var(--label);font-weight:600}

/* Liste raggruppate */
.sezione{margin-bottom:22px}
.sez-head{display:flex;align-items:baseline;gap:8px;padding:0 4px 7px}
.sez-head h4{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sez-head span{font-size:15px;color:var(--label2)}
.gruppo{background:var(--card);border-radius:14px;overflow:hidden}
.riga{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:62px;position:relative}
.riga + .riga::before{content:"";position:absolute;top:0;right:0;left:58px;height:.5px;background:var(--sep)}
.riga.tap:active{background:var(--fill)}
.pillola{width:32px;height:32px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center}
.testo{flex:1;min-width:0}
.testo .n{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.testo .d{font-size:15px;color:var(--label2);margin-top:1px}
.testo .d.rosso{color:var(--red);font-weight:500}
.testo .d.verde{color:var(--green)}
.riga.fatta .n{color:var(--label2)}
.chev{color:var(--label3);flex:none}
.tag{font-size:13px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--fill);color:var(--label2);flex:none}
.tag.basso{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}

/* Bottone spunta stile Promemoria */
.spunta{width:44px;height:44px;margin:-6px -8px -6px 0;display:flex;align-items:center;justify-content:center;flex:none}
.spunta i{width:30px;height:30px;border-radius:50%;border:2px solid var(--label3);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.spunta.ritardo i{border-color:var(--red)}
.spunta.fatto i{background:var(--green);border-color:var(--green)}
.spunta svg{opacity:0}
.spunta.fatto svg{opacity:1}
.spunta:active i{transform:scale(.88)}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

.vuoto{text-align:center;padding:60px 24px;color:var(--label2)}
.vuoto .big{width:64px;height:64px;border-radius:16px;background:var(--fill);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:var(--label2)}
.vuoto h3{color:var(--label);font-size:20px;font-weight:600;margin-bottom:6px}
.btn-blu{display:inline-block;margin-top:18px;background:var(--blue);color:#fff;font-weight:600;border-radius:12px;padding:13px 22px}

/* Note */
.compose{background:var(--card);border-radius:14px;padding:4px 14px 10px;margin-bottom:22px}
.compose textarea{width:100%;border:none;background:none;resize:none;min-height:80px;padding:10px 0;font-size:17px;outline:none}
.compose .bar{display:flex;justify-content:flex-end;border-top:.5px solid var(--sep);padding-top:8px}
.compose button{color:var(--blue);font-weight:600;padding:6px 2px}
.compose button:disabled{color:var(--label3)}
.nota{padding:12px 14px;position:relative}
.nota + .nota::before{content:"";position:absolute;top:0;right:0;left:14px;height:.5px;background:var(--sep)}
.nota .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--label2);margin-bottom:4px}
.nota .meta button{color:var(--red);font-size:13px}
.nota p{white-space:pre-wrap;-webkit-user-select:text;user-select:text}

/* Tab bar */

function iso(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}

function diffGiorni(a, b){ return Math.round((dt(b) - dt(a)) / 864e5); }
// Periodo di terapia: inizio, fine ed eventuale pausa ciclica (es. 21 giorni sì, 15 di pausa, poi riprende)
function inPeriodo(f, g){
  if (f.stop && g >= f.stop) return {ok:false}; // terapia interrotta
  if (f.inizio && g < f.inizio) return {ok:false};
  if (!f.fine) return {ok:true, rif:f.inizio};
  if (!f.inizio) return {ok: g <= f.fine};
  const len = diffGiorni(f.inizio, f.fine) + 1, d = diffGiorni(f.inizio, g), p = Number(f.pausa) || 0;
  if (p > 0){ const ciclo = len + p, pos = d % ciclo; return {ok: pos < len, rif: sposta(g, -pos), pos, len, ciclo}; }
  return {ok: g <= f.fine, rif: f.inizio, pos: d, len};
}
function terminato(f){ const oggi = iso(new Date()); return !!((f.stop && f.stop <= oggi) || (f.fine && !(Number(f.pausa) > 0) && f.fine < oggi)); }
function previsto(f, g){
  const fr = f.frequenza || 'giornaliera';
  if (fr === 'bisogno') return false;
  if (f.creatoIl && g < iso(new Date(f.creatoIl))) return false; // prima che il farmaco fosse inserito
  const per = inPeriodo(f, g); if (!per.ok) return false;
  if (fr === 'ogniN'){ const n = Math.max(2, Number(f.ogniN)||2); const diff = diffGiorni(per.rif || f.inizio || g, g); return diff >= 0 && diff % n === 0; }
  if (fr === 'settimana') return (f.giorniSett || []).includes((dt(g).getDay()+6)%7);
  return true;
}
function breveData(g){ return dt(g).toLocaleDateString('it-IT', {day:'numeric', month:'short'}); }
function descrDurata(f){
  const oggi = iso(new Date()), p = Number(f.pausa) || 0;
  if (f.stop && f.stop <= oggi) return `Interrotta il ${breveData(f.stop)}`;
  if (f.inizio && f.inizio > oggi) return `Inizia il ${breveData(f.inizio)}` + (f.fine ? `, fino al ${breveData(f.fine)}` : '');
  if (!f.fine) return '';
  if (!p) return f.fine < oggi ? `Terminata il ${breveData(f.fine)}` : `Fino al ${breveData(f.fine)}`;
  const per = inPeriodo(f, oggi);
  if (per.ok) return `Ciclo: giorno ${per.pos + 1} di ${per.len}, poi ${p} giorni di pausa`;
  const d = diffGiorni(f.inizio, oggi) % per.ciclo || 0, len = diffGiorni(f.inizio, f.fine) + 1;
  return `In pausa, riprende il ${breveData(sposta(oggi, (len + p) - d))}`;
}
function ultimoGiorno(f, g){
  if (!f.fine) return '';
  const per = inPeriodo(f, g);
  if (!per.ok || per.len == null || per.pos !== per.len - 1) return '';
  return `<div class="d" style="color:var(--orange);font-weight:500">Ultimo giorno${Number(f.pausa) > 0 ? `, poi ${f.pausa} giorni di pausa` : ' di terapia'}</div>`;
}
function descrFreq(f){
  const fr = f.frequenza || 'giornaliera';
  if (fr === 'bisogno') return 'Al bisogno';
  if (fr === 'ogniN') return (Number(f.ogniN)||2) === 2 ? 'Giorni alterni' : `Ogni ${f.ogniN} giorni`;
  if (fr === 'settimana') return [...(f.giorniSett||[])].sort().map(i => ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'][i]).join(' ') || 'Nessun giorno';
  return 'Ogni giorno';
}

}

function dosiDelGiorno(){
  const dosi = [];
  for (const [fid,f] of Object.entries(farmaci)){
    if (f.attivo===false || !previsto(f, giorno)) continue;
    (f.orari||[]).forEach(ora => dosi.push({fid,f,ora}));
  }
  for (const [k,s] of Object.entries(somm)){
    if (s.ora && !s.bisogno && !dosi.some(d => chiave(d.fid,d.ora)===k)) dosi.push({fid:s.fid, f:farmaci[s.fid]||{nome:s.nome||'Farmaco'}, ora:s.ora, orfano:!farmaci[s.fid]});
  }
  return dosi.sort((a,b)=>a.ora.localeCompare(b.ora) || (a.f.nome||'').localeCompare(b.f.nome||''));
}
function inRitardo(ora, g = giorno){
  const oggi = iso(new Date());
  if (g < oggi) return true;
  if (g > oggi) return false;
  const n = new Date(), [h,m] = ora.split(':').map(Number);
  return n.getHours()*60+n.getMinutes() > h*60+m+30;
}

// ====== ANELLI (stile Fitness) ======
const ANELLI = [
  {id:'dosi',  c1:'#FF2D55', c2:'#FF5E7E', etich:'Dosi date'},
  {id:'punt',  c1:'#34C759', c2:'#5DD87D', etich:'Puntuali'},
  {id:'sett',  c1:'#32ADE6', c2:'#5AC8FA', etich:'Settimana'}
];
let anelliVisti = '';
function svgAnelli(valori, size, anima){
  const sw = size * .115, gap = sw * .22, c = size / 2;
  let h = `<svg class="anelli ${anima ? 'anima' : ''}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><defs>`;
  ANELLI.forEach(a => h += `<linearGradient id="gr-${a.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a.c1}"/><stop offset="1" stop-color="${a.c2}"/></linearGradient>`);
  h += `</defs>`;
  valori.forEach((p, i) => {
    const a = ANELLI[i], r = c - sw/2 - i*(sw+gap), C = 2*Math.PI*r, v = Math.max(0, Math.min(1, p || 0));
    h += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${a.c1}" stroke-opacity=".14" stroke-width="${sw}"/>`;
    if (v > 0) h += `<circle class="arco" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="url(#gr-${a.id})" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-v)).toFixed(2)}" style="--c:${C.toFixed(2)};animation-delay:${i*.12}s" transform="rotate(-90 ${c} ${c})"/>`;
  });
  return h + `</svg>`;
}
function miniAnello(p, size, colore, vuoto){
  const sw = size * .13, r = size/2 - sw/2, C = 2*Math.PI*r, v = Math.max(0, Math.min(1, p || 0));
  return `<svg class="mini-anello" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--fill)" stroke-width="${sw}"/>
    ${v > 0 ? `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colore}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-v)).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>` : ''}</svg>`;
}
function statsGiorno(g, sg){
  const d = dosiPreviste(g); let date = 0, salt = 0, punt = 0;
  d.forEach(x => {
    const r = sg && sg[chiave(x.fid, x.ora)]; if (!r) return;
    if (r.modo === 'saltata'){ salt++; return; }
    date++;
    const [hh, mm] = x.ora.split(':').map(Number), prev = dt(g); prev.setHours(hh, mm, 0, 0);
    if (Math.abs(r.ts - prev.getTime()) <= 60*60000) punt++;
  });
  return {tot: d.length, date, salt, punt};
}
function traQuanto(ora){
  const [h, m] = ora.split(':').map(Number), n = new Date(), min = h*60 + m - (n.getHours()*60 + n.getMinutes());
  if (min <= 0) return 'adesso';
  if (min < 60) return `tra ${min} min`;
  const hh = Math.floor(min/60), mm = min % 60;
  return `tra ${hh} h${mm ? ' ' + mm + ' min' : ''}`;
}
// Settimana visibile: ascolta i 7 giorni per gli anellini del calendario
function lunediDi(g){ return sposta(g, -((dt(g).getDay()+6)%7)); }
function ascoltaSettimana(forza){
  const lun = lunediDi(giorno);
  if (!forza && lun === settLun && refsSett.length) return;
  settLun = lun; stacca(refsSett); settSomm = {};
  for (let i = 0; i < 7; i++){
    const g = sposta(lun, i);
    ascolta(PR().child('somministrazioni/' + g), s => { settSomm[g] = s.val() || {}; render(); }, refsSett);
  }
}
function segnaTutte(ora){
  if (!chi) { chiediNome(() => segnaTutte(ora)); return; }
  const n = dosiDelGiorno().filter(x => x.ora === ora && !x.orfano && !somm[chiave(x.fid, x.ora)]).length;
  menuChi(`${n} farmaci delle ${ora}`, [
    ["Le ho date io", `registraTutte('${ora}','data')`],
    ["Le ha prese da sola", `registraTutte('${ora}','sola')`],
    ["Non le ha prese", `registraTutte('${ora}','saltata')`, 'rosso']]);
}
function registraTutte(ora, modo){
  chiudi(); vibra();
  dosiDelGiorno().filter(x => x.ora === ora && !x.orfano && !somm[chiave(x.fid, x.ora)]).forEach(x => {
    PR().child(`somministrazioni/${giorno}/${chiave(x.fid, x.ora)}`).set({fid:x.fid, ora:x.ora, nome:x.f.nome||'', chi, modo, ts:Date.now()});
    if (modo !== 'saltata') aggiornaScorta(x.fid, -(num(x.f.perDose) ?? 1));
  });
}

function vistaOggi(){
  const oggi = iso(new Date());
  const titolo = giorno===oggi ? 'Oggi' : giorno===sposta(oggi,-1) ? 'Ieri' : giorno===sposta(oggi,1) ? 'Domani'
    : dt(giorno).toLocaleDateString('it-IT',{weekday:'long'}).replace(/^./,c=>c.toUpperCase());
  const sotto = dt(giorno).toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});
  let h = `<h1 class="titolo">${titolo}</h1><p class="sottotitolo">${sotto}</p>`;

  // Settimana con anellini
  const lun = lunediDi(giorno);
  h += `<div class="settimana"><button class="freccia" onclick="scegliGiorno(sposta(giorno,-7))" aria-label="Settimana precedente"><svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2L2 8l6 6"/></svg></button>`;
  for (let i=0;i<7;i++){
    const g = sposta(lun,i), st = statsGiorno(g, settSomm[g]);
    const anello = st.tot ? miniAnello(st.date/st.tot, 40, '#FF2D55', g > oggi) : '';
    h += `<button class="gg ${g===giorno?'sel':''} ${g===oggi?'oggi':''}" onclick="scegliGiorno('${g}')" aria-label="${dt(g).toLocaleDateString('it-IT',{weekday:'long',day:'numeric'})}">
      <span>${GIORNI[i]}</span><i class="gg-r">${anello}<b>${dt(g).getDate()}</b></i></button>`;
  }
  h += `<button class="freccia" onclick="scegliGiorno(sposta(giorno,7))" aria-label="Settimana successiva"><svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l6 6-6 6"/></svg></button></div>`;

  if (!Object.keys(farmaci).length && !Object.keys(somm).length) return h + `<div class="vuoto"><div class="big">${svgPillola.replace(/#fff/g,'currentColor').replace('18" height="18','32" height="32')}</div>
    <h3>Nessun farmaco in programma</h3><p>Aggiungi i farmaci di ${esc(nomePaz())} con dose e orari: compariranno qui ogni giorno.</p>
    <button class="btn-blu" onclick="vai('farmaci');apriFarmaco()">Aggiungi farmaco</button></div>`;

  const dosi = dosiDelGiorno();
  const alBisogno = Object.entries(farmaci).filter(([,f]) => f.attivo!==false && f.frequenza==='bisogno' && inPeriodo(f, giorno).ok).sort((a,b)=>a[1].nome.localeCompare(b[1].nome));
  const valide = dosi.filter(x => !x.orfano);

  // ===== Riquadro anelli =====
  if (valide.length){
    const st = statsGiorno(giorno, somm);
    let sDate = 0, sTot = 0;
    for (let i = 0; i < 7; i++){ const g = sposta(lun, i); if (g > oggi) break; const x = g === giorno ? st : statsGiorno(g, settSomm[g]); sDate += x.date; sTot += x.tot; }
    const pSett = sTot ? sDate/sTot : 0;
    const ritardi = valide.filter(x => !somm[chiave(x.fid,x.ora)] && inRitardo(x.ora));
    const prossime = valide.filter(x => !somm[chiave(x.fid,x.ora)] && !inRitardo(x.ora));
    const fatte = valide.filter(x => somm[chiave(x.fid,x.ora)]).length;
    let msg, tono = '';
    if (ritardi.length){ tono = 'rosso'; msg = ritardi.length === 1 ? `${ritardi[0].f.nome} delle ${ritardi[0].ora} non risulta data` : `${ritardi.length} dosi non risultano date`; }
    else if (fatte === valide.length){ tono = 'verde'; msg = st.salt ? `Tutto segnato, ${st.salt === 1 ? '1 dose non presa' : st.salt + ' dosi non prese'}` : (giorno === oggi ? 'Tutto fatto per oggi' : 'Tutte le dosi date'); }
    else if (prossime.length && giorno === oggi){ const pr = prossime[0], stesse = prossime.filter(x => x.ora === pr.ora).length;
      msg = `Prossima alle ${pr.ora}, ${traQuanto(pr.ora)}: ${pr.f.nome}${stesse > 1 ? ` e altri ${stesse-1}` : ''}`; }
    else msg = `${prossime.length} ${prossime.length === 1 ? 'dose' : 'dosi'} da dare`;
    const chiaveAnim = paz + giorno; const anima = anelliVisti !== chiaveAnim; anelliVisti = chiaveAnim;
    const voci = [
      [ANELLI[0], `${st.date}<small>/${st.tot}</small>`],
      [ANELLI[1], st.date ? `${st.punt}<small>/${st.date}</small>` : `–`],
      [ANELLI[2], sTot ? `${Math.round(pSett*100)}<small>%</small>` : `–`]
    ];
    h += `<div class="hero">
      <div class="hero-top">
        <div class="hero-anelli">${svgAnelli([st.tot ? st.date/st.tot : 0, st.date ? st.punt/st.date : 0, pSett], 108, anima)}</div>
        <div class="hero-dati">${voci.map(([a, v]) => `<div class="hd"><i style="background:${a.c1}"></i><span>${a.etich}</span><b>${v}</b></div>`).join('')}</div>
      </div>
      <div class="hero-msg ${tono}"><i class="pallino ${tono === 'rosso' ? '' : tono === 'verde' ? 'verde' : 'blu'}"></i>${esc(msg)}</div>
    </div>`;
  } else {
    h += `<div class="riepilogo"><div><h3>Nessuna dose a orario</h3><p>${alBisogno.length ? 'In questo giorno ci sono solo i farmaci al bisogno.' : 'Nessun farmaco previsto in questo giorno.'}</p></div></div>`;
  }

  // ===== Avvisi come widget =====
  const widget = [];
  const bassi = Object.values(farmaci).filter(f => f.attivo!==false && !terminato(f) && scortaBassa(f));
  if (bassi.length) widget.push(`<div class="widget tap" onclick="vai('farmaci')"><div class="w-ic" style="background:var(--orange)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg></div>
    <div class="w-tit">Da ricomprare</div><div class="w-val">${bassi.length === 1 ? esc(bassi[0].nome) : bassi.length + ' farmaci'}</div><div class="w-sub">${bassi.map(f => `${esc(f.nome)} ${f.scorta}`).join(', ')}</div></div>`);
  if (giorno === oggi){
    const vicina = Object.values(visite).filter(v => v.data >= oggi && v.data <= sposta(oggi,7)).sort((a,b) => (a.data+(a.ora||'')).localeCompare(b.data+(b.ora||'')))[0];
    if (vicina) widget.push(`<div class="widget tap" onclick="vai('visite')"><div class="w-ic" style="background:var(--blue)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
      <div class="w-tit">Prossima visita</div><div class="w-val">${esc(vicina.titolo)}</div><div class="w-sub">${esc(quandoVisita(vicina))}</div></div>`);
  }
  if (widget.length) h += `<div class="widgets ${widget.length === 1 ? 'uno' : ''}">${widget.join('')}</div>`;

  // ===== Fasce orarie =====
  const gruppi = {};
  dosi.forEach(x => (gruppi[x.ora] ||= []).push(x));
  for (const [o,lista] of Object.entries(gruppi)){
    const val = lista.filter(x => !x.orfano), fatteF = val.filter(x => somm[chiave(x.fid,x.ora)]).length;
    const daFare = val.length - fatteF, ritF = daFare && inRitardo(o);
    const col = fatteF === val.length ? '#34C759' : ritF ? '#FF3B30' : '#007AFF';
    h += `<div class="sezione"><div class="sez-head fascia-h">${val.length ? miniAnello(val.length ? fatteF/val.length : 0, 24, col) : ''}<h4>${o}</h4><span>${fascia(o)}</span>
      ${val.length ? `<em class="${fatteF === val.length ? 'ok' : ritF ? 'rit' : ''}">${fatteF === val.length ? 'Fatto' : fatteF + ' di ' + val.length}</em>` : ''}
      ${daFare >= 2 ? `<button class="tutte" onclick="segnaTutte('${o}')">Segna tutte</button>` : ''}</div><div class="gruppo">`;
    lista.forEach(x => {
      const k = chiave(x.fid,x.ora), s = somm[k], rit = !s && inRitardo(x.ora);
      if (x.orfano){
        h += `<div class="riga fatta">${pill(x.fid)}<div class="testo"><div class="n">${esc(x.f.nome)}</div><div class="d">Farmaco eliminato dall'elenco</div></div>
          <button class="link" style="font-size:15px;color:var(--red)" onclick="rimuoviOrfano('${k}')">Rimuovi</button></div>`;
        return;
      }
      const da = s?.chi && s.chi!=='—' ? esc(s.chi) : '';
      const det = !s ? (rit ? `<div class="d rosso">Non ancora data${x.f.dose?' · '+esc(x.f.dose):''}</div>` : `<div class="d">${esc(x.f.dose||'')}${x.f.note ? ' · ' + esc(x.f.note) : ''}</div>`)
        : s.modo==='saltata' ? `<div class="d arancio">Non presa${da?', segnato da '+da:''} alle ${hhmm(s.ts)}</div>`
        : s.modo==='sola' ? `<div class="d verde">Presa da sola${da?', segnato da '+da:''} alle ${hhmm(s.ts)}</div>`
        : `<div class="d verde">Data${da?' da '+da:''} alle ${hhmm(s.ts)}</div>`;
      h += `<div class="riga tap ${s?'fatta':''}" onclick="apriFarmaco('${x.fid}')">${pill(x.fid)}<div class="testo"><div class="n">${esc(x.f.nome)}</div>${det}${svgGenerico(x.f)}${s ? '' : ultimoGiorno(x.f, giorno)}</div>
        <button class="spunta ${s?(s.modo==='saltata'?'fatto saltata':'fatto'):''} ${rit?'ritardo':''}" onclick="event.stopPropagation(); ${s?`annulla('${x.fid}','${x.ora}')`:`segna('${x.fid}','${x.ora}')`}" aria-label="${s?'Annulla dose':'Segna dose'}">
        <i class="${ultimaSpunta===k?'pop':''}">${s?.modo==='saltata'?svgX:svgCheck}</i></button></div>`;
    });
    h += `</div></div>`;
  }

  // ===== Al bisogno =====
  if (alBisogno.length){
    h += `<div class="sezione"><div class="sez-head"><h4>Al bisogno</h4><span>Solo quando serve</span></div><div class="gruppo">`;
    alBisogno.forEach(([fid,f]) => {
      const prese = Object.entries(somm).filter(([,s]) => s.bisogno && s.fid===fid).sort((a,b)=>a[1].ts-b[1].ts);
      const max = num(f.maxGiorno), n = prese.length;
      const info = max ? `${n} di ${max} al massimo${f.dose?' · '+esc(f.dose):''}` : (f.dose ? esc(f.dose) : (n ? `${n} ${n===1?'volta':'volte'}` : 'Nessuna dose registrata'));
      h += `<div class="riga tap" onclick="apriFarmaco('${fid}')">${pill(fid)}<div class="testo"><div class="n">${esc(f.nome)}</div><div class="d ${max && n>=max?'arancio':''}">${info}</div></div>
        ${max ? `<span class="bis-anello">${miniAnello(n/max, 30, n >= max ? '#FF9500' : '#34C759')}<b>${n}</b></span>` : ''}
        <button class="btn-bisogno" onclick="event.stopPropagation(); segnaBisogno('${fid}')">Registra</button></div>`;
      prese.forEach(([k,s]) => {
        const da = s.chi && s.chi!=='—' ? ' da '+esc(s.chi) : '';
        h += `<div class="riga sotto"><div class="testo"><div class="d verde">${s.modo==='sola' ? 'Presa da sola, segnato'+da : 'Data'+da} alle ${s.ora}</div></div>
          <button class="link" style="font-size:15px" onclick="annullaBisogno('${k}')">Annulla</button></div>`;
      });
    });
    h += `</div></div>`;
  }
  return h;
}

function vistaFarmaci(){

  const lista = Object.entries(farmaci).sort((a,b)=>fermo(a[1])-fermo(b[1]) || a[1].nome.localeCompare(b[1].nome));

    <button class="btn-blu" onclick="apriFarmaco()">Aggiungi farmaco</button></div>`;
  h += `<p class="sottotitolo">${lista.filter(([,f])=>!fermo(f)).length} in terapia</p>`;
  const attivi = lista.filter(([,f])=>!fermo(f)), sospesi = lista.filter(([,f])=>fermo(f));
  const riga = ([fid,f]) => `<div class="riga tap" onclick="apriFarmaco('${fid}')" style="${fermo(f)?'opacity:.5':''}">${pill(fid)}
    <div class="testo"><div class="n">${esc(f.nome)}</div><div class="d">${descrFreq(f)}${f.frequenza!=='bisogno' && (f.orari||[]).length ? ', '+f.orari.join(' ') : ''}${f.dose?' · '+esc(f.dose):''}</div>${descrDurata(f) ? `<div class="d" style="color:var(--blue)">${esc(descrDurata(f))}</div>` : ''}${svgGenerico(f)}${f.note ? `<div class="d" style="color:var(--label)">${esc(f.note)}</div>` : ''}</div>

// ====== AZIONI DOSI ======
function aggiornaScorta(fid, delta){
  const f = farmaci[fid]; if (!f || !inScorta(f)) return;
  PR().child(`farmaci/${fid}/scorta`).transaction(v => v==null ? v : Math.max(0, Number(v)+delta));
}
function menuChi(titolo, scelte){
  apri(`<div class="form" style="padding-top:14px">
    <p class="f-label" style="text-align:center;font-size:15px">${esc(titolo)}</p>
    <div class="f-gruppo">${scelte.map(([t,az,cl]) => `<button class="f-riga scelta ${cl||''}" onclick="${az}">${t}</button>`).join('')}</div>
    <div class="f-gruppo"><button class="f-riga scelta" style="font-weight:600" onclick="chiudi()">Annulla</button></div>
  </div>`);
}
function segna(fid, ora){
  if (!chi) { chiediNome(() => segna(fid, ora)); return; }
  menuChi(`${farmaci[fid]?.nome||''} delle ${ora}`, [
    ["L'ho data io", `registra('${fid}','${ora}','data')`],
    ["L'ha presa da sola", `registra('${fid}','${ora}','sola')`],
    ["Non l'ha presa", `registra('${fid}','${ora}','saltata')`, 'rosso']]);
}
function registra(fid, ora, modo){
  chiudi();
  const f = farmaci[fid], k = chiave(fid,ora);
  vibra(); ultimaSpunta = k;
  PR().child(`somministrazioni/${giorno}/${k}`).set({fid, ora, nome:f?.nome||'', chi, modo, ts:Date.now()});
  if (modo !== 'saltata') aggiornaScorta(fid, -(num(f?.perDose) ?? 1));
}
function annulla(fid, ora){
  const s = somm[chiave(fid,ora)];
  if (!confirm('Annullare? La dose tornerà da segnare.')) return;
  PR().child(`somministrazioni/${giorno}/${chiave(fid,ora)}`).remove();
  if (s?.modo !== 'saltata') aggiornaScorta(fid, num(farmaci[fid]?.perDose) ?? 1);
}
function segnaBisogno(fid){
  if (!chi) { chiediNome(() => segnaBisogno(fid)); return; }
  const f = farmaci[fid], max = num(f.maxGiorno);
  const n = Object.values(somm).filter(s => s.bisogno && s.fid===fid).length;
  if (max && n >= max && !confirm(`${f.nome}: in questo giorno risultano già ${n} dosi su un massimo di ${max}.\n\nRegistrare comunque?`)) return;
  menuChi(`${f.nome} alle ${hhmm(Date.now())}`, [
    ["L'ho data io", `registraBisogno('${fid}','data')`],
    ["L'ha presa da sola", `registraBisogno('${fid}','sola')`]]);
}
function registraBisogno(fid, modo){
  chiudi();
  const f = farmaci[fid], ts = Date.now();
  vibra();
  PR().child(`somministrazioni/${giorno}/${fid}_b${ts}`).set({fid, ora:hhmm(ts), nome:f?.nome||'', chi, modo, bisogno:true, ts});
  aggiornaScorta(fid, -(num(f?.perDose) ?? 1));
}
function annullaBisogno(k){
  const s = somm[k]; if (!s || !confirm('Annullare questa dose?')) return;
  PR().child(`somministrazioni/${giorno}/${k}`).remove();
  aggiornaScorta(s.fid, num(farmaci[s.fid]?.perDose) ?? 1);
}

const iconaSvg = `<svg width="58" height="58" viewBox="0 0 24 24"><g transform="rotate(-45 12 12)"><path d="M12 8H6.5a4 4 0 000 8H12z" fill="#fff"/><path d="M12 8h5.5a4 4 0 010 8H12z" fill="#fff" fill-opacity=".6"/></g></svg>`;
function coloreNome(n){ let h = 0; for (const c of n) h = (h*31 + c.charCodeAt(0)) >>> 0; const pal = COLORI.filter(c => c!=='#FFCC00'); return pal[h % pal.length]; }

function righeNomi(inSheet){

  return elencoNomi().map(([id,p]) => `<div class="f-riga nome-riga">

function mostraBenvenuto(){
  const b = document.getElementById('benvenuto');
  b.innerHTML = `<div class="bv-wrap"><div class="icona">${iconaSvg}</div>
    <h1>Benvenuto</h1><p>Chi sta usando questo telefono?</p>
    <div class="f-gruppo">${righeNomi(false)}</div>
    <p class="f-nota" style="margin-top:-12px">Il nome resta salvato su questo telefono. Puoi cambiarlo quando vuoi toccando il cerchio in alto a destra.</p></div>`;
  b.classList.remove('via'); b.classList.add('visibile');
}
function nascondiBenvenuto(){
  const b = document.getElementById('benvenuto');
  if (!b.classList.contains('visibile')) return;
  b.classList.add('via');
  setTimeout(() => b.classList.remove('visibile','via'), 350);
}
function chiediNome(dopo){
  window._dopoNome = typeof dopo === 'function' ? dopo : null;
  modificaNomi = false; disegnaSheetNomi();
}
function disegnaSheetNomi(){
  apri(nav('Chi sei?', [modificaNomi ? 'Fine' : 'Modifica', 'toggleModificaNomi()'], ['Chiudi','chiudi()']) +
    `<div class="form"><div class="f-gruppo">${righeNomi(true)}</div>
    <p class="f-nota">Il nome è salvato solo su questo telefono. Con "Modifica" puoi togliere un nome dall'elenco: le dosi già registrate restano.</p></div>`);
  window._sheetNomi = true;
}
function toggleModificaNomi(){ modificaNomi = !modificaNomi; disegnaSheetNomi(); }
function aggiornaNomiUI(){
  if (document.getElementById('benvenuto').classList.contains('visibile')) mostraBenvenuto();
  if (window._sheetNomi) disegnaSheetNomi();
}
function scegliNome(id){ const p = persone[id]; if (p) salvaNome(p.nome); }
function mostraSaluto(n){
  const sp = document.getElementById('splash');
  document.getElementById('spNome').textContent = testoSaluto(n);
  document.getElementById('spSotto').textContent = 'Farmaci Nonni';
  sp.querySelector('.spinner').style.display = 'none';
  sp.querySelectorAll('.icona,.sp-nome,.sp-sotto').forEach(el => { el.style.animation = 'none'; el.offsetHeight; el.style.animation = ''; });
  sp.classList.remove('via');
  setTimeout(() => sp.classList.add('via'), 2200);
}
function salvaNome(n){
  n = (n||'').trim(); if (!n) return;
  const primaVolta = document.getElementById('benvenuto').classList.contains('visibile');
  chi = n; localStorage.setItem('chi', n);
  if (primaVolta) mostraSaluto(n);
  nascondiBenvenuto(); chiudi(); render();
  if (window._dopoNome){ const f = window._dopoNome; window._dopoNome = null; f(); }
}
function nuovoNome(eSceglilo){
  const n = (prompt('Nome da aggiungere') || '').trim(); if (!n) return;
  const esiste = elencoNomi().find(([,p]) => p.nome.toLowerCase() === n.toLowerCase());
  if (esiste){ if (eSceglilo) salvaNome(esiste[1].nome); else alert('Questo nome è già nell\'elenco.'); return; }
  ROOT.child('persone').push({nome:n, ts:Date.now()});
  if (eSceglilo) salvaNome(n);
}
function eliminaNome(id){
  const p = persone[id]; if (!p) return;
  if (!confirm(`Togliere ${p.nome} dall'elenco?\n\nLe dosi che ha già registrato restano.`)) return;
  ROOT.child('persone/'+id).remove();
}

  </div>`);
  aggiornaFreqUI(); aggiornaDurata();
  if (!fid) setTimeout(()=>document.getElementById('fNome').focus(), 400);
}
function aggiornaDurata(origine){
  const ini = document.getElementById('fInizio'), gg = document.getElementById('fGiorni'), fi = document.getElementById('fFine'), pa = document.getElementById('fPausa');
  if (!ini) return;
  const n = Math.round(num(gg.value) || 0);
  if (origine === 'giorni'){ if (n > 0 && ini.value) fi.value = sposta(ini.value, n - 1); else if (!gg.value) fi.value = ''; }
  if ((origine === 'fine' || origine === 'inizio') && ini.value && fi.value) gg.value = Math.max(1, diffGiorni(ini.value, fi.value) + 1);
  if (origine === 'fine' && !fi.value) gg.value = '';
  const p = Math.round(num(pa.value) || 0), lunga = g => dt(g).toLocaleDateString('it-IT', {day:'numeric', month:'long'});
  let t;
  if (fi.value && ini.value && fi.value < ini.value) t = 'Attenzione: la fine è prima dell\'inizio.';
  else if (fi.value && ini.value){
    const len = diffGiorni(ini.value, fi.value) + 1;
    t = `Dal ${lunga(ini.value)} al ${lunga(fi.value)}, ${len === 1 ? '1 giorno' : len + ' giorni'}` +
      (p > 0 ? `. Poi ${p} giorni di pausa e riprende dal ${lunga(sposta(fi.value, p + 1))}, ripetendo il ciclo.` : ', poi la terapia finisce.');
  } else if (fi.value) t = 'Indica anche la data di inizio.';
  else t = ini.value ? `Dal ${lunga(ini.value)}, senza data di fine.` : 'Senza date: la terapia vale sempre.';
  if (p > 0 && !fi.value) t += ' La pausa serve solo se c\'è una data di fine.';
  document.getElementById('fDurataNota').textContent = t;
}
function togliDate(){
  ['fInizio','fGiorni','fFine','fPausa'].forEach(id => document.getElementById(id).value = '');
  aggiornaDurata();
}
function interrompiTerapia(fid){
  const f = farmaci[fid]; if (!f) return;
  if (!confirm(`Interrompere la terapia con ${f.nome} da oggi?\n\nNon comparirà più in Oggi. Le dosi già segnate restano e potete riprenderla quando volete.`)) return;
  PR().child('farmaci/' + fid).update({stop: iso(new Date()), modificatoDa: chi || '—', modificatoIl: Date.now()});
  chiudi();
}
function riprendiTerapia(fid){
  const f = farmaci[fid]; if (!f) return;
  if (!confirm(`Riprendere la terapia con ${f.nome} da oggi?`)) return;
  const upd = {stop: null, modificatoDa: chi || '—', modificatoIl: Date.now()};
  if (f.fine && f.fine < iso(new Date())){ upd.fine = null; upd.pausa = null; upd.inizio = iso(new Date()); }
  if (f.inizio && f.inizio > iso(new Date())) upd.inizio = iso(new Date());
  if (f.frequenza === 'ogniN' && !upd.inizio) upd.inizio = iso(new Date());
  PR().child('farmaci/' + fid).update(upd);
  chiudi();
}
function scegliFreq(v){ freqSel = v; aggiornaFreqUI(); }
function aggiornaFreqUI(){
  document.querySelectorAll('[data-freq]').forEach(b => b.querySelector('svg').style.visibility = b.dataset.freq===freqSel ? 'visible' : 'hidden');
  document.getElementById('boxOgniN').style.display = freqSel==='ogniN' ? '' : 'none';
  document.getElementById('boxSett').style.display = freqSel==='settimana' ? '' : 'none';
  document.getElementById('boxBisogno').style.display = freqSel==='bisogno' ? '' : 'none';
  document.getElementById('boxOrari').style.display = freqSel==='bisogno' ? 'none' : '';
}
function toggleGiorno(i){
  giorniSel = giorniSel.includes(i) ? giorniSel.filter(x => x!==i) : [...giorniSel, i];
  document.querySelectorAll('.giorni-sett button').forEach(b => b.classList.toggle('sel', giorniSel.includes(+b.dataset.g)));
}
function rigaOrario(o){return `<div class="f-riga"><button class="meno" onclick="this.parentNode.remove()" aria-label="Rimuovi orario"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 5h7" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button><input type="time" value="${o}"></div>`;}
function aggiungiOrario(){ document.getElementById('fOrari').insertAdjacentHTML('beforeend', rigaOrario('12:00')); }
function scegliColore(c){ coloreSel = c; document.querySelectorAll('#fColori button').forEach(b => b.classList.toggle('sel', b.dataset.c===c)); }
function salvaFarmaco(fid){
  const nome = document.getElementById('fNome').value.trim();
  if (!nome){ document.getElementById('fNome').focus(); return; }
  const orari = [...document.querySelectorAll('#fOrari input')].map(i=>i.value).filter(Boolean);
  const vIni = document.getElementById('fInizio').value, vFine = document.getElementById('fFine').value;
  if (vFine && !vIni){ alert('Indica la data di inizio della terapia.'); return; }
  if (vFine && vFine < vIni){ alert('La data di fine è prima di quella di inizio.'); return; }
  if (freqSel==='settimana' && !giorniSel.length){ alert('Scegli almeno un giorno della settimana.'); return; }
  if (freqSel!=='bisogno' && !orari.length){ alert('Aggiungi almeno un orario.'); return; }
  const dati = {
    nome, dose: document.getElementById('fDose').value.trim(),
    frequenza: freqSel,
    orari: freqSel==='bisogno' ? [] : [...new Set(orari)].sort(),
    ogniN: freqSel==='ogniN' ? Math.max(2, Math.round(num(document.getElementById('fOgniN').value) ?? 2)) : null,
    inizio: document.getElementById('fInizio').value || (freqSel==='ogniN' ? iso(new Date()) : null),
    fine: document.getElementById('fFine').value || null,
    pausa: document.getElementById('fFine').value ? (Math.round(num(document.getElementById('fPausa').value) || 0) || null) : null,
    giorniSett: freqSel==='settimana' ? [...giorniSel].sort() : null,
    maxGiorno: freqSel==='bisogno' ? num(document.getElementById('fMax').value) : null,
    scorta: num(document.getElementById('fScorta').value),
    soglia: num(document.getElementById('fSoglia').value) ?? 7,
    perDose: num(document.getElementById('fPerDose').value) ?? 1,
    note: document.getElementById('fNote').value.trim(),
    colore: coloreSel,
    attivo: document.getElementById('fAttivo').checked,
    modificatoDa: chi || '—', modificatoIl: Date.now()
  };
  dati.generico = document.getElementById('fGenerico').value.trim();
  dati.stop = fid ? (farmaci[fid]?.stop || null) : null;
  dati.creatoIl = fid ? (farmaci[fid]?.creatoIl || farmaci[fid]?.modificatoIl || Date.now()) : Date.now();
  dati.miniatura = fotoRimossa ? null : (fotoNuova ? fotoMini : (fid ? farmaci[fid]?.miniatura || null : null));
  const ref = fid ? PR().child('farmaci/'+fid) : PR().child('farmaci').push();
  ref.set(dati);
  if (fotoNuova) PR().child('foto/' + ref.key).set(fotoNuova);
  else if (fotoRimossa) PR().child('foto/' + ref.key).remove();
  chiudi();
}
function eliminaFarmaco(fid){
  if (!confirm(`Eliminare ${farmaci[fid].nome}?\n\nSe va sospeso solo per un periodo, meglio disattivare \"In terapia\".`)) return;
  PR().child('farmaci/'+fid).remove(); PR().child('foto/'+fid).remove(); chiudi();
  // Toglie anche le sue dosi di oggi, così non resta una riga "fantasma" in Oggi (lo storico dei giorni passati resta)
  const oggi = iso(new Date());
  PR().child('somministrazioni/' + oggi).once('value').then(snap => {
    const upd = {};
    Object.entries(snap.val() || {}).forEach(([k,v]) => { if (v.fid === fid) upd[k] = null; });
    if (Object.keys(upd).length) PR().child('somministrazioni/' + oggi).update(upd);
  });
}
function rimuoviOrfano(k){
  if (!confirm('Togliere questa riga? Il farmaco non è più nell\'elenco.')) return;
  PR().child(`somministrazioni/${giorno}/${k}`).remove();
}

// ====== VISITE ======
const MESI = ['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
let visitaAcc = '';
function quandoVisita(v){
  const oggi = iso(new Date());
  const ora = v.ora ? ` alle ${v.ora}` : '';
  if (v.data === oggi) return 'Oggi' + ora;
  if (v.data === sposta(oggi,1)) return 'Domani' + ora;
  const diff = Math.round((dt(v.data) - dt(oggi)) / 864e5);
  if (diff > 1 && diff < 7) return dt(v.data).toLocaleDateString('it-IT',{weekday:'long'}).replace(/^./,c=>c.toUpperCase()) + ora;
  return dt(v.data).toLocaleDateString('it-IT',{day:'numeric',month:'long'}) + ora;
}
function rigaVisita([id,v], passata){
  const d = dt(v.data);
  return `<div class="riga visita tap ${passata?'passata':''}" onclick="apriVisita('${id}')">
    <div class="cal"><span>${MESI[d.getMonth()]}</span><b>${d.getDate()}</b></div>
    <div class="testo"><div class="n">${esc(v.titolo)}</div>
      <div class="d">${esc(passata ? (d.getFullYear()!==new Date().getFullYear() ? d.getFullYear()+(v.ora?', ':'') : '') + (v.ora||'') : quandoVisita(v))}${v.luogo ? ((passata && !v.ora && d.getFullYear()===new Date().getFullYear()) ? '' : ' · ') + esc(v.luogo) : ''}</div>
      ${v.accompagna ? `<div class="d">Accompagna ${esc(v.accompagna)}</div>` : ''}
      ${passata && v.esito ? `<div class="d clamp" style="color:var(--label)">${esc(v.esito)}</div>` : ''}
    </div>${svgChev}</div>`;
}
function vistaVisite(){
  let h = `<h1 class="titolo">Visite</h1>`;
  const oggi = iso(new Date()), lista = Object.entries(visite);
  const chiaveOrd = ([,v]) => v.data + (v.ora || '');
  const prossime = lista.filter(([,v]) => v.data >= oggi).sort((a,b) => chiaveOrd(a).localeCompare(chiaveOrd(b)));
  const passate = lista.filter(([,v]) => v.data < oggi).sort((a,b) => chiaveOrd(b).localeCompare(chiaveOrd(a)));
  if (!lista.length) return h + `<div class="vuoto"><div class="big"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
    <h3>Nessuna visita</h3><p>Segna qui le visite di ${esc(nomePaz())}: data, medico, chi la accompagna e cosa ha detto il medico.</p>
    <button class="btn-blu" onclick="apriVisita()">Aggiungi visita</button></div>`;
  h += `<p class="sottotitolo">${prossime.length ? (prossime.length===1 ? '1 visita in programma' : prossime.length + ' visite in programma') : 'Nessuna visita in programma'}</p>`;
  if (prossime.length) h += `<div class="sezione"><div class="sez-head"><h4>In programma</h4></div><div class="gruppo">${prossime.map(x => rigaVisita(x,false)).join('')}</div></div>`;
  if (passate.length) h += `<div class="sezione"><div class="sez-head"><h4>Passate</h4></div><div class="gruppo">${passate.map(x => rigaVisita(x,true)).join('')}</div></div>`;
  return h;
}
function apriVisita(id){

    <div class="f-label">Note</div>

function salvaVisita(id){

function eliminaVisita(id){

// ====== FOTO ======
let fotoMini = null, fotoNuova = null, fotoRimossa = false;
const svgCamera = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
function htmlFotoBox(){
  if (fotoMini) return `<div class="foto-box"><img src="${fotoMini}" alt="Foto della scatola" onclick="vediFotoScheda()">
    <div class="foto-azioni"><button class="link" onclick="document.getElementById('fFotoIn').click()">Cambia foto</button>
    <button class="link" style="color:var(--red)" onclick="rimuoviFoto()">Rimuovi foto</button></div></div>`;
  return `<button class="f-riga azione" style="width:100%" onclick="document.getElementById('fFotoIn').click()">${svgCamera}Scatta o scegli una foto</button>`;
}
function ridimensiona(img, max, q, quadrata){
  const w = img.naturalWidth, h = img.naturalHeight, c = document.createElement('canvas'), x = c.getContext('2d');
  if (quadrata){ const l = Math.min(w,h); c.width = c.height = max; x.drawImage(img, (w-l)/2, (h-l)/2, l, l, 0, 0, max, max); }
  else { const r = Math.min(1, max / Math.max(w,h)); c.width = Math.round(w*r); c.height = Math.round(h*r); x.drawImage(img, 0, 0, c.width, c.height); }
  return c.toDataURL('image/jpeg', q);
}
function caricaFoto(input){
  const file = input.files && input.files[0]; if (!file) return;
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    fotoNuova = ridimensiona(img, 900, .72, false);
    fotoMini = ridimensiona(img, 160, .7, true);
    fotoRimossa = false; URL.revokeObjectURL(url);
    document.getElementById('fFotoBox').innerHTML = htmlFotoBox();
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert('Non riesco a leggere questa foto. Prova a scattarla di nuovo.'); };
  img.src = url; input.value = '';
}
function rimuoviFoto(){ fotoMini = null; fotoNuova = null; fotoRimossa = true; document.getElementById('fFotoBox').innerHTML = htmlFotoBox(); }
let fidAperto = null;
function apriVisore(src, titolo, sotto, caricaGrande){
  const v = document.getElementById('visore');
  v.classList.remove('zoom');
  v.innerHTML = `<button class="chiudi" onclick="chiudiFoto()">Fine</button>
    <img id="visoreImg" src="${src}" alt="Foto della scatola" onclick="event.stopPropagation(); document.getElementById('visore').classList.toggle('zoom')">
    ${titolo ? `<p>${esc(titolo)}</p>` : ''}${sotto ? `<p style="font-weight:400;opacity:.7;margin-top:-8px">${esc(sotto)}</p>` : ''}
    <p class="aiuto">Tocca la foto per ingrandirla</p>`;
  v.scrollTo(0,0); v.classList.add('aperto');
  if (caricaGrande) caricaGrande.then(d => { const el = document.getElementById('visoreImg'); if (d && el) el.src = d; });
}
function vediFoto(fid){
  const f = farmaci[fid]; if (!f?.miniatura) return;
  apriVisore(f.miniatura, f.nome, f.generico ? 'Generico: ' + f.generico : '', PR().child('foto/' + fid).once('value').then(s => s.val()));
}
function vediFotoScheda(){
  if (fotoNuova) return apriVisore(fotoNuova, document.getElementById('fNome')?.value || '', '');
  if (!fotoMini) return;
  apriVisore(fotoMini, document.getElementById('fNome')?.value || '', '', fidAperto ? PR().child('foto/' + fidAperto).once('value').then(s => s.val()) : null);
}
function chiudiFoto(){ document.getElementById('visore').classList.remove('aperto','zoom'); }

// ====== CONDIVIDI REPORT ======
let stampaModo = 'giorno', reportFile = null, reportToken = 0;
let pdfLib = null;
function caricaScript(src){ return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }); }
function caricaPdfLib(){
  if (!pdfLib) pdfLib = caricaScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js').catch(e => { pdfLib = null; throw e; });
  return pdfLib;
}
const svgPdf = `<svg width="28" height="32" viewBox="0 0 28 32" fill="none"><path d="M4 1h14l9 9v19a2 2 0 01-2 2H4a2 2 0 01-2-2V3a2 2 0 012-2z" fill="var(--fill)" stroke="var(--label3)"/><path d="M18 1v7a2 2 0 002 2h7" stroke="var(--label3)"/><text x="14" y="24" text-anchor="middle" font-size="7" font-weight="700" fill="var(--red)" font-family="-apple-system,sans-serif">PDF</text></svg>`;

function apriStampa(){
  stampaModo = 'giorno';
  apri(nav('Condividi', ['Annulla','chiudi()'], ['Condividi','condividiTerapia()']) + `<div class="form">
    <div class="f-gruppo"><div class="f-riga" id="stStato" style="min-height:64px"></div></div>
    <div class="f-label">Periodo</div>
    <div class="f-gruppo">${[['giorno','Un giorno'],['settimana','Una settimana']].map(([v,l]) => `<button class="f-riga opzione" data-st="${v}" onclick="stampaModo='${v}'; aggiornaStampaUI(); preparaReport()"><span>${l}</span>${svgSpunta}</button>`).join('')}</div>
    <div class="f-gruppo">
      <div class="f-riga"><label for="stData" id="stLabel">Giorno</label><input type="date" class="dx" id="stData" value="${giorno}" onchange="preparaReport()"></div>
      <div class="f-riga"><label for="stFoto">Foto delle scatole</label><input type="checkbox" class="switch" id="stFoto" checked onchange="preparaReport()"></div>
    </div>
    <p class="f-nota">Il report riporta le dosi date, quelle non prese e quelle mancanti, con chi le ha segnate. Si condivide su WhatsApp, per email o si stampa.</p></div>`);
  aggiornaStampaUI(); preparaReport();
}
function aggiornaStampaUI(){
  document.querySelectorAll('[data-st]').forEach(b => b.querySelector('svg').style.visibility = b.dataset.st===stampaModo ? 'visible' : 'hidden');
  document.getElementById('stLabel').textContent = stampaModo==='giorno' ? 'Giorno' : 'A partire dal';
}
function statoReport(pronto, testo){
  const b = document.querySelector('.sheet-nav .dx'), st = document.getElementById('stStato');
  if (b) b.disabled = !pronto;
  if (st) st.innerHTML = `${svgPdf}<div class="testo" style="margin-left:4px"><div class="n" style="font-size:16px">${esc(pronto ? reportFile.name.replace('.pdf','') : 'Report')}</div><div class="d">${esc(testo)}</div></div>
    ${pronto ? '' : '<svg class="spinner-mini" width="20" height="20" viewBox="0 0 26 26">' + [...Array(8)].map((_,i) => `<rect x="11.8" y="1.5" width="2.4" height="7" rx="1.2" fill="currentColor" opacity="${(1-i*.11).toFixed(2)}" transform="rotate(${-i*45} 13 13)"/>`).join('') + '</svg>'}`;
}
async function preparaReport(){
  const tok = ++reportToken; reportFile = null;
  statoReport(false, 'Preparo il report…');
  try {
    await caricaPdfLib();
    const g0 = document.getElementById('stData').value || giorno, foto = document.getElementById('stFoto').checked, modo = stampaModo;
    const giorni = modo === 'settimana' ? [...Array(7)].map((_,i) => sposta(g0, i)) : [g0];
    const letti = await Promise.all(giorni.map(g => PR().child('somministrazioni/' + g).once('value').then(s => s.val() || {})));
    if (tok !== reportToken) return;
    const sommPer = {}; giorni.forEach((g,i) => sommPer[g] = letti[i]);
    const res = creaPdf(modo, giorni, foto, sommPer);
    reportFile = new File([res.blob], res.nome, {type:'application/pdf'});
    statoReport(true, `Pronto da condividere, ${res.pagine === 1 ? '1 pagina' : res.pagine + ' pagine'}`);
  } catch(e){
    console.error(e);
    if (tok === reportToken) statoReport(false, 'Non riesco a prepararlo: controlla la connessione');
  }
}
async function condividiTerapia(){
  if (!reportFile) return;
  const file = reportFile;
  chiudi();
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file]}); }
    catch(e){ if (e.name !== 'AbortError') scaricaPdf(file); }
  } else scaricaPdf(file);
}
function scaricaPdf(file){
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

// Stato di una dose in un giorno: data, sola, saltata, mancata, dafare
function statoDose(fid, ora, g, sg){
  const r = sg[chiave(fid, ora)];
  if (r) return {stato: r.modo==='saltata' ? 'saltata' : (r.modo==='sola' ? 'sola' : 'data'), chi: r.chi && r.chi!=='—' ? r.chi : '', ts: r.ts};
  return {stato: inRitardo(ora, g) ? 'mancata' : 'dafare'};
}
function dosiPreviste(g){
  const d = [];
  for (const [fid,f] of Object.entries(farmaci)){
    if (f.attivo===false || !previsto(f, g)) continue;
    (f.orari||[]).forEach(ora => d.push({fid, f, ora}));
  }
  return d.sort((a,b) => a.ora.localeCompare(b.ora) || a.f.nome.localeCompare(b.f.nome));
}

function creaPdf(modo, giorni, foto, sommPer){
  const { jsPDF } = window.jspdf;
  const sett = modo === 'settimana';
  const doc = new jsPDF({orientation: sett ? 'landscape' : 'portrait', unit:'mm', format:'a4'});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 16, FONDO = 16;
  const C = {label:[28,28,30], sec:[110,110,115], ter:[160,160,165], sep:[222,222,228], card:[242,242,247],
    green:[52,199,89], orange:[255,149,0], red:[255,59,48], blue:[0,122,255], gray:[174,174,178], white:[255,255,255]};
  const rgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
  const oggi = iso(new Date());
  let y = 0;

  // --- primitive ---
  const font = (size, bold, color) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(...(color||C.label)); };
  const tronca = (t, w) => { t = String(t||''); if (doc.getTextWidth(t) <= w) return t; while (t.length > 1 && doc.getTextWidth(t + '…') > w) t = t.slice(0,-1); return t.trimEnd() + '…'; };
  const scrivi = (t, x, yy, o = {}) => { font(o.size||11, o.bold, o.color); doc.text(o.w ? tronca(t, o.w) : String(t), x, yy, {align: o.align||'left', baseline:'middle'}); };
  const riempi = c => doc.setFillColor(...c), traccia = c => doc.setDrawColor(...c);
  const tondo = (x, yy, w, h, r, c) => { riempi(c); doc.roundedRect(x, yy, w, h, r, r, 'F'); };
  function immagine(img, x, yy, s, r, tipo){
    try { doc.saveGraphicsState(); doc.roundedRect(x, yy, s, s, r, r, null); doc.clip(); doc.discardPath(); doc.addImage(img, tipo||'JPEG', x, yy, s, s); doc.restoreGraphicsState(); }
    catch(e){ try { doc.restoreGraphicsState(); } catch(_){} }
  }
  function miniatura(fid, f, x, yy, s){
    if (foto && f.miniatura) return immagine(f.miniatura, x, yy, s, s*.22);
    tondo(x, yy, s, s, s*.22, rgb(colore(fid)));
    scrivi((f.nome||'?').trim()[0].toUpperCase(), x+s/2, yy+s/2+.2, {size: s*1.6, bold:true, color:C.white, align:'center'});
  }
  function icona(stato, cx, cy, r){
    doc.setLineCap('round'); doc.setLineJoin('round');
    if (stato==='data' || stato==='sola'){
      riempi(C.green); doc.circle(cx, cy, r, 'F'); traccia(C.white); doc.setLineWidth(r*.28);
      doc.line(cx-r*.45, cy+r*.02, cx-r*.12, cy+r*.36); doc.line(cx-r*.12, cy+r*.36, cx+r*.48, cy-r*.36);
    } else if (stato==='saltata'){
      riempi(C.orange); doc.circle(cx, cy, r, 'F'); traccia(C.white); doc.setLineWidth(r*.26);
      doc.line(cx-r*.36, cy-r*.36, cx+r*.36, cy+r*.36); doc.line(cx+r*.36, cy-r*.36, cx-r*.36, cy+r*.36);
    } else if (stato==='mancata'){
      traccia(C.red); doc.setLineWidth(r*.24); doc.circle(cx, cy, r*.88, 'S');
      riempi(C.red); doc.circle(cx, cy, r*.3, 'F');
    } else if (stato==='dafare'){
      traccia(C.gray); doc.setLineWidth(r*.2); doc.circle(cx, cy, r*.88, 'S');
    } else {
      traccia(C.sep); doc.setLineWidth(.5); doc.line(cx-r*.6, cy, cx+r*.6, cy);
    }
  }
  const ETICHETTA = {data:['Data',C.green], sola:['Presa da sola',C.green], saltata:['Non presa',C.orange], mancata:['Non data',C.red], dafare:['Da dare',C.sec]};

  // --- pagine ---
  function testata(){
    const logo = document.querySelector('link[rel="apple-touch-icon"]')?.href;
    if (logo) immagine(logo, M, 12, 8, 1.9, 'PNG');
    scrivi('Farmaci Nonni', M+11, 16, {size:10, bold:true, color:C.sec});
    const ora = new Date();
    scrivi(`Creato il ${ora.toLocaleDateString('it-IT')} alle ${hhmm(ora)}${chi ? ' da ' + chi : ''}`, W-M, 16, {size:8.5, color:C.ter, align:'right'});
  }
  function nuovaPagina(){ doc.addPage(); testata(); y = 30; }
  const serve = h => { if (y + h > H - FONDO) nuovaPagina(); };
  function titoloSezione(t, sotto){
    serve(16);
    scrivi(t, M, y, {size:14, bold:true});
    if (sotto){ font(14, true); const w = doc.getTextWidth(t); scrivi(sotto, M + w + 3, y + .3, {size:10.5, color:C.sec}); }
    y += 6;
  }
  // card a righe (altezza fissa o variabile) con interruzione di pagina
  function card(righe, altezza, disegna, sinistraSep){
    const hOf = r => typeof altezza === 'function' ? altezza(r) : altezza;
    let i = 0;
    while (i < righe.length){
      serve(hOf(righe[i]));
      let n = 0, tot = 0;
      while (i + n < righe.length && y + tot + hOf(righe[i+n]) <= H - FONDO){ tot += hOf(righe[i+n]); n++; }
      if (!n){ n = 1; tot = hOf(righe[i]); }
      tondo(M, y, W-2*M, tot, 3.2, C.card);
      let ry = y;
      for (let k = 0; k < n; k++){
        if (k > 0){ traccia(C.sep); doc.setLineWidth(.25); doc.line(M + (sinistraSep||4), ry, W-M-4, ry); }
        disegna(righe[i+k], ry, hOf(righe[i+k]));
        ry += hOf(righe[i+k]);
      }
      y += tot; i += n;
      if (i < righe.length) nuovaPagina();
    }
    y += 8;
  }
  const NOTA = [72,72,78];
  function riquadri(voci){
    const gap = 4, w = (W - 2*M - gap*(voci.length-1)) / voci.length, h = 21;
    serve(h + 8);
    voci.forEach(([num, sotto, etich, col], i) => {
      const x = M + i*(w+gap);
      tondo(x, y, w, h, 3.2, C.card);
      font(20, true, col); doc.text(String(num), x+5, y+9.5, {baseline:'middle'});
      if (sotto){ const nw = doc.getTextWidth(String(num)); scrivi(sotto, x+5+nw+1.5, y+10.3, {size:11, bold:true, color:C.ter}); }
      scrivi(etich, x+5, y+16, {size:9, color:C.sec});
    });
    y += h + 10;
  }

  // --- intestazione ---
  testata();
  const lunga = g => dt(g).toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const breve = g => dt(g).toLocaleDateString('it-IT', {day:'numeric', month:'long'});
  y = 33;
  scrivi(nomePaz(), M, y, {size:28, bold:true});
  y += 10;
  scrivi(sett ? `Terapia della settimana, dal ${breve(giorni[0])} al ${lunga(giorni[6]).replace(/^\S+ /,'')}` : `Terapia di ${lunga(giorni[0])}`, M, y, {size:12.5, color:C.sec});
  y += 10;

  // --- dati ---
  const tutte = [];
  giorni.forEach(g => dosiPreviste(g).forEach(x => tutte.push({...x, g, st: statoDose(x.fid, x.ora, g, sommPer[g] || {})})));
  const conta = s => tutte.filter(x => x.st.stato === s).length;
  const date = conta('data') + conta('sola'), saltate = conta('saltata'), mancate = conta('mancata'), dafare = conta('dafare');
  if (tutte.length) riquadri([
    [date, '/' + tutte.length, 'Dosi date', C.green],
    [saltate, '', 'Non prese', saltate ? C.orange : C.ter],
    [mancate, '', 'Non date', mancate ? C.red : C.ter],
    [dafare, '', 'Ancora da dare', dafare ? C.blue : C.ter]
  ]);

  if (!sett){
    // ===== GIORNO =====
    const g = giorni[0];
    if (!tutte.length){ titoloSezione('Nessun farmaco a orario in questo giorno'); }
    const gruppi = {};
    tutte.forEach(x => (gruppi[x.ora] ||= []).push(x));
    for (const [ora, lista] of Object.entries(gruppi)){
      serve(6 + 16);
      titoloSezione(ora, fascia(ora));
      card(lista, x => x.f.note ? 20.5 : 16, (x, ry, hh) => {
        miniatura(x.fid, x.f, M+4, ry + hh/2 - 4.5, 9);
        const xs = M+17, wTesto = W - M - 62 - xs;
        scrivi(x.f.nome, xs, ry+6.3, {size:11.5, bold:true, w:wTesto});
        scrivi([x.f.dose, x.f.generico ? 'Generico: ' + x.f.generico : ''].filter(Boolean).join('  ·  '), xs, ry+11, {size:8.8, color:C.sec, w:wTesto});
        if (x.f.note) scrivi('Nota: ' + x.f.note, xs, ry+15.6, {size:8.8, color:NOTA, w:wTesto});
        const [et, col] = ETICHETTA[x.st.stato], cy = ry + hh/2;
        icona(x.st.stato, W-M-8, cy, 2.9);
        if (x.st.ts){
          scrivi(et, W-M-14, cy-1.7, {size:10, bold:true, color:col, align:'right'});
          scrivi(`${x.st.chi ? x.st.chi + ', ' : ''}alle ${hhmm(x.st.ts)}`, W-M-14, cy+2.8, {size:8.5, color:C.sec, align:'right'});
        } else scrivi(et, W-M-14, cy+.2, {size:10, bold:true, color:col, align:'right'});
      }, 17);
    }
    // Al bisogno
    const bis = Object.entries(farmaci).filter(([,f]) => f.attivo!==false && f.frequenza==='bisogno').sort((a,b) => a[1].nome.localeCompare(b[1].nome));
    if (bis.length){
      titoloSezione('Al bisogno', 'solo quando serve');
      card(bis, ([,f]) => f.note ? 20.5 : 16, ([fid,f], ry, hh) => {
        miniatura(fid, f, M+4, ry + hh/2 - 4.5, 9);
        const xs = M+17, wTesto = W - M - 70 - xs;
        scrivi(f.nome, xs, ry+6.3, {size:11.5, bold:true, w:wTesto});
        scrivi([f.dose, f.maxGiorno ? `massimo ${f.maxGiorno} al giorno` : '', f.generico ? 'Generico: ' + f.generico : ''].filter(Boolean).join('  ·  '), xs, ry+11, {size:8.8, color:C.sec, w:wTesto});
        if (f.note) scrivi('Nota: ' + f.note, xs, ry+15.6, {size:8.8, color:NOTA, w:wTesto});
        const prese = Object.values(sommPer[g] || {}).filter(s => s.bisogno && s.fid===fid).sort((a,b) => a.ts-b.ts), cy = ry + hh/2;
        if (prese.length){
          icona('data', W-M-8, cy, 2.9);
          scrivi(prese.length === 1 ? 'Presa 1 volta' : `Presa ${prese.length} volte`, W-M-14, cy-1.7, {size:10, bold:true, color:C.green, align:'right'});
          scrivi(prese.map(s => s.ora + (s.chi && s.chi!=='—' ? ' ' + s.chi : '')).join(', '), W-M-14, cy+2.8, {size:8.5, color:C.sec, align:'right', w:60});
        } else scrivi('Non presa', W-M-14, cy+.2, {size:10, bold:true, color:C.ter, align:'right'});
      }, 17);
    }
  } else {
    // ===== SETTIMANA =====
    const righe = {};
    tutte.forEach(x => { const k = x.ora + '|' + x.fid; (righe[k] ||= {fid:x.fid, f:x.f, ora:x.ora, giorni:{}}).giorni[x.g] = x.st; });
    const lista = Object.values(righe).sort((a,b) => a.ora.localeCompare(b.ora) || a.f.nome.localeCompare(b.f.nome));
    const sx = 108, cw = (W - M - sx) / 7, GG = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
    const testaGiorni = () => {
      serve(14);
      scrivi('Farmaco', M+4, y+5, {size:8.5, bold:true, color:C.sec});
      giorni.forEach((g,i) => {
        const cx = sx + cw*i + cw/2, d = dt(g);
        scrivi(GG[d.getDay()], cx, y+2.5, {size:8.5, bold:true, color:C.sec, align:'center'});
        if (g === oggi){ riempi(C.red); doc.circle(cx, y+8.2, 3.3, 'F'); }
        scrivi(String(d.getDate()), cx, y+8.4, {size:11, bold:true, color: g===oggi ? C.white : C.label, align:'center'});
      });
      y += 14;
    };
    if (lista.length){
      titoloSezione('Farmaci a orario');
      testaGiorni();
      let ultimaOra = null;
      card(lista, r => r.f.note ? 17.5 : 14, (r, ry, hh) => {
        if (r.ora !== ultimaOra || ry < 40) scrivi(r.ora, M+4, ry+hh/2, {size:10.5, bold:true});
        ultimaOra = r.ora;
        miniatura(r.fid, r.f, M+17, ry + hh/2 - 4, 8);
        scrivi(r.f.nome, M+28, ry+5.6, {size:10.5, bold:true, w: sx-M-32});
        scrivi([r.f.dose, r.f.generico ? 'Gen.: ' + r.f.generico : ''].filter(Boolean).join('  ·  '), M+28, ry+10, {size:8, color:C.sec, w: sx-M-32});
        if (r.f.note) scrivi('Nota: ' + r.f.note, M+28, ry+14, {size:8, color:NOTA, w: sx-M-32});
        giorni.forEach((g,i) => icona(r.giorni[g] ? r.giorni[g].stato : 'no', sx + cw*i + cw/2, ry + hh/2, 2.5));
      }, 17);
    } else titoloSezione('Nessun farmaco a orario in questa settimana');

    const bis = Object.entries(farmaci).filter(([,f]) => f.attivo!==false && f.frequenza==='bisogno').sort((a,b) => a[1].nome.localeCompare(b[1].nome));
    if (bis.length){
      titoloSezione('Al bisogno', 'quante volte è stato preso');
      testaGiorni();
      card(bis, ([,f]) => f.note ? 17.5 : 14, ([fid,f], ry, hh) => {
        miniatura(fid, f, M+4, ry + hh/2 - 4, 8);
        scrivi(f.nome, M+15, ry+5.6, {size:10.5, bold:true, w: sx-M-19});
        scrivi([f.dose, f.maxGiorno ? `max ${f.maxGiorno} al giorno` : ''].filter(Boolean).join('  ·  '), M+15, ry+10, {size:8, color:C.sec, w: sx-M-19});
        if (f.note) scrivi('Nota: ' + f.note, M+15, ry+14, {size:8, color:NOTA, w: sx-M-19});
        const cy = ry + hh/2;
        giorni.forEach((g,i) => {
          const n = Object.values(sommPer[g] || {}).filter(s => s.bisogno && s.fid===fid).length, cx = sx + cw*i + cw/2;
          if (n){ const sopra = f.maxGiorno && n > f.maxGiorno; riempi(sopra ? C.orange : C.green); doc.circle(cx, cy, 2.7, 'F'); scrivi(String(n), cx, cy+.2, {size:9, bold:true, color:C.white, align:'center'}); }
          else icona('no', cx, cy, 2.5);
        });
      }, 4);
    }
    // legenda
    serve(10);
    let lx = M;
    [['data','Data'],['saltata','Non presa'],['mancata','Non data'],['dafare','Da dare'],['no','Non prevista']].forEach(([s,t]) => {
      icona(s, lx+2.4, y+2, 2.1); scrivi(t, lx+6.5, y+2.2, {size:8.5, color:C.sec}); font(8.5); lx += 10 + doc.getTextWidth(t) + 6;
    });
    y += 12;
  }

  // --- Da ricomprare ---
  const bassi = Object.entries(farmaci).filter(([,f]) => f.attivo!==false && scortaBassa(f));
  if (bassi.length){
    titoloSezione('Da ricomprare');
    card(bassi, 12, ([fid,f], ry) => {
      miniatura(fid, f, M+4, ry+2.5, 7);
      scrivi(f.nome, M+15, ry+6.2, {size:10.5, bold:true});
      scrivi(`${f.scorta} rimaste`, W-M-5, ry+6.2, {size:10, bold:true, color:C.orange, align:'right'});
    }, 15);
  }

  // --- Visite ---
  const da = giorni[0], fino = sposta(giorni[giorni.length-1], 30);
  const vis = Object.values(visite).filter(v => v.data >= da && v.data <= fino).sort((a,b) => (a.data+(a.ora||'')).localeCompare(b.data+(b.ora||''))).slice(0, 8);
  if (vis.length){
    titoloSezione('Prossime visite');
    const MESI = ['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
    card(vis, 15, (v, ry) => {
      const d = dt(v.data);
      riempi(C.white); doc.roundedRect(M+4, ry+2.5, 10, 10, 2, 2, 'F');
      scrivi(MESI[d.getMonth()], M+9, ry+5, {size:6, bold:true, color:C.red, align:'center'});
      scrivi(String(d.getDate()), M+9, ry+9.4, {size:11, bold:true, align:'center'});
      scrivi(v.titolo + (v.medico ? ', ' + v.medico : ''), M+18, ry+5.9, {size:11, bold:true, w: W-2*M-70});
      scrivi([d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'}) + (v.ora ? ' alle ' + v.ora : ''), v.luogo].filter(Boolean).join('  ·  '), M+18, ry+10.6, {size:8.8, color:C.sec, w: W-2*M-70});
      if (v.accompagna) scrivi('Accompagna ' + v.accompagna, W-M-5, ry+7.6, {size:9, color:C.sec, align:'right'});
    }, 18);
  }

  // --- Note del periodo ---
  const daNote = sposta(giorni[0], -7), aNote = giorni[giorni.length-1];
  const not = Object.values(note).filter(n => { const g = iso(new Date(n.ts)); return g >= daNote && g <= aNote; }).sort((a,b) => b.ts-a.ts);
  if (not.length){
    titoloSezione('Note', sett ? 'della settimana e dei 7 giorni prima' : 'del giorno e dei 7 giorni prima');
    not.forEach(n => {
      font(10); const righe = doc.splitTextToSize(n.testo, W-2*M-10), h = 10 + righe.length*4.6;
      serve(h);
      tondo(M, y, W-2*M, h, 3.2, C.card);
      scrivi(`${n.chi || ''}, ${new Date(n.ts).toLocaleString('it-IT', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}`, M+5, y+5, {size:8.5, bold:true, color:C.sec});
      font(10, false, C.label); doc.text(righe, M+5, y+10.5, {baseline:'middle', lineHeightFactor:1.3});
      y += h + 3;
    });
    y += 5;
  }

  // --- piè di pagina ---
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++){
    doc.setPage(i);
    scrivi(`Terapia di ${nomePaz()}`, M, H-8, {size:8, color:C.ter});
    scrivi(`Pagina ${i} di ${n}`, W-M, H-8, {size:8, color:C.ter, align:'right'});
  }
  const dd = giorni[0].split('-').reverse().join('-');
  return {blob: doc.output('blob'), nome: `Terapia ${nomePaz()} ${sett ? 'settimana dal ' : ''}${dd}.pdf`, pagine: n};
}

// ====== NOTE ======
function aggiungiNota(){
  const t = document.getElementById('nuovaNota').value.trim(); if (!t) return;
  if (!chi) { chiediNome(aggiungiNota); return; }
  PR().child('note').push({testo:t, chi, ts:Date.now()});
}
function eliminaNota(id){ if (confirm('Eliminare questa nota?')) PR().child('note/'+id).remove(); }

renderSeg();
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
